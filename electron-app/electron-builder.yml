appId: com.bcr-analysis.app
productName: Clono
copyright: Copyright © 2024

directories:
  output: release
  buildResources: static

# Fails the build when the bundled Python runtime for the target architecture
# is missing, instead of quietly shipping an app without an interpreter.
beforePack: scripts/before-pack.js

files:
  - dist/**/*
  - static/**/*
  - "!**/*.ts"
  - "!**/node_modules/**/*.md"
  - "!**/node_modules/**/*.d.ts"

extraResources:
  # Backend Python code
  - from: ../backend
    to: backend
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
  
  # IgBLAST and IQ-TREE binaries, fetched by scripts/install.sh
  - from: ../geneGUI/bin
    to: bin
    filter:
      - "**/*"
  
  # Database and reference files
  - from: ../geneGUI/data
    to: data
    filter:
      - "**/*"
      # Generated BLAST indexes from the developer's own runs. They are rebuilt
      # into the user's cache on first use, and shipping them would put stale
      # indexes inside a directory the app can no longer write to.
      - "!Database-Files/**"

  # Self-contained Python interpreter with changeo/presto/biopython already
  # installed, built by scripts/bundle-python.sh. ${arch} keeps the arm64 and
  # x64 builds from picking up each other's interpreter.
  - from: runtime/${arch}/python
    to: python
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!**/test/**"
      - "!**/tests/**"

mac:
  category: public.app-category.healthcare-fitness
  icon: static/icon.icns
  # Architectures come from the command line, so `--arm64` really means arm64
  # only. Listing them here instead made every build produce both, including
  # ones whose Python runtime had not been built.
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  # Runs only when notarisation credentials are in the environment, so ordinary
  # local builds are unaffected. See docs/SIGNING.md.
  #
  # Deliberately no teamId here. @electron/notarize treats the presence of
  # teamId as "password credentials", so combining it with an App Store Connect
  # API key trips its "Cannot use password credentials, API key credentials and
  # keychain credentials at once" check. The API key already identifies the team.
  notarize: true
  extendInfo:
    NSAppleEventsUsageDescription: "This app needs access to run analysis scripts."
    # Electron 28 and the bundled CPython are both built with minos 11.0, so
    # anything older cannot launch. Declaring it makes the Finder say so
    # instead of letting the app crash on start.
    LSMinimumSystemVersion: "11.0"

dmg:
  # The volume name must not contain spaces. electron-builder's default title is
  # "${productName} ${version}", and hdiutil then mounts the staging image at
  # "/Volumes/Clono 1.0.0-arm64" and fails to read back what it just wrote:
  #
  #   could not access /Volumes/Clono 1.0.0-arm64/Clono.app - Operation not permitted
  #   hdiutil: create failed - Operation not permitted
  #
  # Same command with a hyphenated volume name succeeds every time. The failure
  # is silent in electron-builder's normal output, which retries six times and
  # then reports only ERR_ELECTRON_BUILDER_CANNOT_EXECUTE.
  title: Clono-${version}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

win:
  icon: static/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  publisherName: BCR Analysis Team

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: true
  installerIcon: static/icon.ico
  uninstallerIcon: static/icon.ico
  license: LICENSE.txt

linux:
  icon: static/icons
  category: Science
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  desktop:
    Name: B-Cell Repertoire Analysis
    Comment: Analyze B-cell receptor repertoire data
    Categories: Science;Biology;

appImage:
  license: LICENSE.txt

# No publish provider is configured on purpose. While one is present,
# electron-builder computes auto-update metadata for every artifact even under
# `--publish never`, and fails on it. Publishing to GitHub Releases should be a
# deliberate, separate step: pass the provider on the command line, or add the
# block back together with a `repository` field in package.json.

